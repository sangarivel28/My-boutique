name: Build and Push Online Boutique Images to GHCR
 
on:
  push:
    branches:
      - aws-devops
  workflow_dispatch:
 
permissions:
  contents: read
  packages: write
 
jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
 
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: emailservice
            context: ./src/emailservice
          - service: productcatalogservice
            context: ./src/productcatalogservice
          - service: recommendationservice
            context: ./src/recommendationservice
          - service: shoppingassistantservice
            context: ./src/shoppingassistantservice
          - service: shippingservice
            context: ./src/shippingservice
          - service: checkoutservice
            context: ./src/checkoutservice
          - service: paymentservice
            context: ./src/paymentservice
          - service: currencyservice
            context: ./src/currencyservice
          - service: cartservice
            context: ./src/cartservice/src
          - service: frontend
            context: ./src/frontend
          - service: adservice
            context: ./src/adservice
          - service: loadgenerator
            context: ./src/loadgenerator
 
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/online-boutique-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/online-boutique-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}